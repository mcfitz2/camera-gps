[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

[alias]
# Prototype: generic ESP32 dev board (BLE + serial console only).
build-proto = "build --release --target xtensa-esp32-espidf --features board-proto"
run-proto = "run --release --target xtensa-esp32-espidf --features board-proto"
# Seeed XIAO ESP32-S3 with OLED, buttons and battery sense.
build-xiao = "build --release --target xtensa-esp32s3-espidf --features board-xiao"
run-xiao = "run --release --target xtensa-esp32s3-espidf --features board-xiao"
