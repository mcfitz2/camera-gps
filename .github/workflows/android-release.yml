name: Android release

# Push a tag like v1.2.0 to publish the APK as a GitHub release.
#
# Signing: set the repository secrets RELEASE_KEYSTORE_BASE64 (the keystore,
# base64-encoded), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD. Without them the release gets a debug-signed APK,
# which installs but can't update over an APK signed with a different key.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-${GITHUB_SHA::7}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build signed release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/camera-gps-${{ steps.version.outputs.name }}.apk"
      - name: Build debug-signed release
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          ./gradlew assembleDebug -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/camera-gps-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: camera-gps-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/camera-gps-*.apk
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/camera-gps-*.apk --generate-notes --title "$GITHUB_REF_NAME"
