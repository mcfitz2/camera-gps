[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
